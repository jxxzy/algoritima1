      <h1>Situs Belajar Algoritma</h1>
      <p>Halaman situs dibuat dari materi terpisah di folder <code>content/</code>.</p>
      <p>Jalankan <code>npm ci</code>, lalu <code>npm run build</code> untuk membuat situs multi-page di folder <code>dist/</code>.</p>
      <p><a href="dist/index.html">Buka hasil build</a></p>
      <p>Untuk deploy, gunakan GitHub Actions pada <code>.github/workflows/pages.yml</code>.</p>
