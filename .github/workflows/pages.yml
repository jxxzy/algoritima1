name: Deploy learning site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install build dependencies
        run: npm ci
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run all Python tests
        run: |
          for n in {1..7}; do python -B -m unittest discover -s "Bab $n" -v || exit 1; done
      - name: Validate JavaScript syntax
        run: node --check app.js && node --check academy.js && node --check python-worker.js && node --check assessment.js && node --check math.js && node --check tools.js && node --check experiments.js && node --check storage.js && node --check extras.js
      - name: JavaScript and Python parity tests
        run: node scripts/parity-test.mjs && node scripts/storage-test.mjs
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Build minified multipage site
        run: npm run build
      - name: Package exercises and validate build
        run: |
          python scripts/package-practicals.py
          python scripts/check-site.py
      - name: Install Chromium smoke-test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          if command -v google-chrome >/dev/null; then echo "PLAYWRIGHT_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"; else npx playwright install chromium; fi
      - name: Browser smoke tests
        run: node scripts/browser-smoke.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify public deployment against local build
        run: python scripts/live-check.py https://jxxzy.github.io/algoritima1/
